<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">提示词管理</div>
              <div class="widget-icons pull-right">
                <button onclick="savePromptConfig()" class="btn btn-lg btn-success examine_ban">保存</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
	          <table class="table table-striped table-bordered table-hover">
	                <tbody>
	                  <tr>
	                    <td style="width:180px">附加提示词（推荐）</td>
	                    <td>
	                    	<textarea id="promptSuffix" class="form-control" rows="5" placeholder="例：你是XX公司的文档助手，请优先用中文回答；回答先给结论再给细节。">{{value.suffix}}</textarea>
	                    	<span class="help-block">追加到默认提示词末尾，用于设定 Agent 的行为规范/身份定位，不影响默认工具调用规则。</span>
	                    </td>
	                  </tr>
	                  <tr>
	                    <td>覆盖提示词（高级）</td>
	                    <td>
	                    	<textarea id="promptOverride" class="form-control" rows="8" placeholder="留空则使用默认提示词。填写后将完全替换默认提示词（含工具调用格式规则），请谨慎使用！">{{value.override}}</textarea>
	                    </td>
	                  </tr>
	                  <tr>
	                    <td>默认提示词预览</td>
	                    <td>
	                    	<textarea class="form-control" rows="10" readonly style="background:#f5f5f5;font-family:monospace;">{{value.defaultPrompt}}</textarea>
	                    </td>
	                  </tr>
	                </tbody>
	          </table>
            </div>
          </div>
        </div>
      </div>
